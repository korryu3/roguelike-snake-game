name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # node、pnpm、Vite+の版はhuman-ledのpackage.jsonで決める。依存も入れる
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: human-led
          version-file: package.json
          node-version-file: package.json

      # mainへ直接pushしたときも、整形・lint・型検査を通ったものだけを公開する
      - name: Check
        working-directory: human-led
        run: vp check

      - name: Test
        working-directory: human-led
        run: vp test run

      - name: Build
        working-directory: human-led
        run: vp build

      - name: Test ai-only
        working-directory: ai-only
        run: npm test

      - name: Build ai-only
        working-directory: ai-only
        run: node build.js

      - name: Assemble site
        run: |
          mkdir -p _site/human-led _site/ai-only
          cp .github/pages/index.html _site/
          cp human-led/dist/index.html _site/human-led/
          cp ai-only/dist/snake.html _site/ai-only/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
