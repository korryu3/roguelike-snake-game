name: CI

on:
  pull_request:
    paths:
      - "human-led/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  human-led:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: human-led
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: human-led/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run fmt:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
